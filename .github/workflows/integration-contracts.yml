name: integration-contracts
on:
  push:
    paths:
      - "integration_contracts/**"
      - "review_app/**"
      - "legacy_compat/**"
      - ".github/workflows/integration-contracts.yml"
  pull_request:
    paths:
      - "integration_contracts/**"
      - "review_app/**"
      - "legacy_compat/**"
      - ".github/workflows/integration-contracts.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s integration_contracts -v
