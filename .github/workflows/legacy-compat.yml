name: legacy-compat
on:
  push:
    paths:
      - "legacy_compat/**"
      - ".github/workflows/legacy-compat.yml"
  pull_request:
    paths:
      - "legacy_compat/**"
      - ".github/workflows/legacy-compat.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: legacy_compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest hedgeops/tests -v
      - run: python -m compileall -q hedgeops
