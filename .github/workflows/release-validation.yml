name: release-validation
on:
  push:
    paths:
      - "review_app/**"
      - "legacy_compat/**"
      - "integration_contracts/**"
      - "docs/release-gates.json"
      - "docs/RELEASE_GATES.md"
      - ".github/workflows/release-validation.yml"
  pull_request:
    paths:
      - "docs/release-gates.json"
      - "docs/RELEASE_GATES.md"
      - "review_app/**"
      - "legacy_compat/**"
      - "integration_contracts/**"
      - ".github/workflows/release-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install legacy test runner
        run: python -m pip install pytest
      - name: Review application tests
        working-directory: review_app
        run: python -m unittest discover -s tests -v
      - name: Deployment preflight policy gates
        working-directory: review_app
        run: |
          python - <<'PY'
          from hedgeops.preflight import inspect_configuration

          local = inspect_configuration({})
          assert local["ok"] and local["binding"] == "loopback", local

          exposed = inspect_configuration({"HEDGEOPS_HOST": "0.0.0.0"})
          assert not exposed["ok"], exposed
          assert {"missing_api_token", "missing_public_origin"} <= {
              f["code"] for f in exposed["findings"]
          }, exposed

          insecure = inspect_configuration({
              "HEDGEOPS_HOST": "0.0.0.0",
              "HEDGEOPS_API_TOKEN": "ci-placeholder",
              "HEDGEOPS_PUBLIC_ORIGIN": "http://example.invalid",
          })
          assert not insecure["ok"], insecure
          assert "public_origin_must_use_https" in {
              f["code"] for f in insecure["findings"]
          }, insecure

          reviewed = inspect_configuration({
              "HEDGEOPS_HOST": "0.0.0.0",
              "HEDGEOPS_API_TOKEN": "ci-placeholder",
              "HEDGEOPS_AUDIT_KEY": "ci-placeholder",
              "HEDGEOPS_PUBLIC_ORIGIN": "https://example.invalid",
          })
          assert reviewed["ok"], reviewed
          assert "non_loopback_binding_requires_reviewed_proxy" in {
              f["code"] for f in reviewed["findings"]
          }, reviewed
          print("Deployment preflight policy gates passed")
          PY
      - name: Verify release gates remain blocked without approval
        run: python review_app/scripts/check_release_gates.py --expect-blocked
      - name: Negative control - unauthorized release-ready state must fail
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          original = json.loads(Path("docs/release-gates.json").read_text())
          assert original["status"] == "blocked"
          with tempfile.TemporaryDirectory() as directory:
              candidate = Path(directory) / "unauthorized-release.json"
              original["status"] = "ready_for_manual_review"
              candidate.write_text(json.dumps(original), encoding="utf-8")
              command = [sys.executable, "review_app/scripts/check_release_gates.py",
                         "--file", str(candidate), "--expect-blocked"]
              result = subprocess.run(command, capture_output=True, text=True)
              assert result.returncode != 0, (
                  "FAIL OPEN: unauthorized release-ready state accepted",
                  result.stdout, result.stderr)
              assert "release status inconsistent" in result.stderr, (
                  "unexpected negative-control failure", result.stderr)
              print("Negative control passed: unauthorized release-ready state rejected")
          PY
      - name: Legacy engine tests
        working-directory: legacy_compat
        run: python -m pytest hedgeops/tests -v
      - name: Cross-system behavioral contracts
        run: python -m unittest discover -s integration_contracts -v
      - name: Compile application and legacy engine
        run: |
          python -m compileall -q review_app/hedgeops
          python -m compileall -q legacy_compat/hedgeops
      - name: Ensure no broker or transaction endpoints in review API
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("review_app/hedgeops/api.py").read_text()
          for forbidden in ('"/execute"', '"/trade"', '"/orders"', '"/approve"'):
              assert forbidden not in source, forbidden
          print("No forbidden API routes found")
          PY
